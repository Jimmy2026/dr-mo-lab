<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dr. Mo. Lab — Content Manager</title>
<style>
  :root {
    --crimson: #841617;
    --crimson-dark: #5c0f10;
    --ink: #1c1c1c;
    --gray-50: #fafafa;
    --gray-100: #f2f1ee;
    --gray-200: #e4e2dc;
    --gray-400: #a49e93;
    --gray-600: #6b6459;
    --gold: #c9973a;
    --ok: #2f7d4f;
    --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font); background: var(--gray-100); color: var(--ink); }
  header {
    background: var(--ink); color: #fff; padding: 18px 28px;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
    position: sticky; top: 0; z-index: 50;
  }
  header h1 { font-size: 1.15rem; margin: 0; font-weight: 600; }
  header h1 span { color: var(--gold); }
  .header-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  button { font-family: inherit; cursor: pointer; }
  .btn {
    border: 1px solid transparent; padding: 9px 16px; border-radius: 6px; font-size: 0.85rem;
    font-weight: 600; transition: 0.15s;
  }
  .btn-primary { background: var(--crimson); color: #fff; }
  .btn-primary:hover { background: var(--crimson-dark); }
  .btn-secondary { background: transparent; color: #fff; border-color: rgba(255,255,255,0.35); }
  .btn-secondary:hover { border-color: #fff; }
  .btn-light { background: #fff; color: var(--ink); border-color: var(--gray-200); }
  .btn-light:hover { border-color: var(--gray-400); }
  .btn-danger { background: #fff; color: #a12a2a; border-color: #e3b8b8; }
  .btn-danger:hover { background: #fdf1f1; }
  .btn-sm { padding: 5px 10px; font-size: 0.75rem; }

  .tabs { display: flex; gap: 4px; padding: 0 28px; background: #fff; border-bottom: 1px solid var(--gray-200);
    overflow-x: auto; position: sticky; top: 61px; z-index: 40; }
  .tab-btn { background: none; border: none; padding: 14px 16px; font-size: 0.85rem; font-weight: 600;
    color: var(--gray-600); border-bottom: 3px solid transparent; white-space: nowrap; }
  .tab-btn.active { color: var(--crimson); border-bottom-color: var(--crimson); }

  main { max-width: 980px; margin: 0 auto; padding: 32px 24px 120px; }
  .panel { display: none; }
  .panel.active { display: block; }
  .card { background: #fff; border: 1px solid var(--gray-200); border-radius: 10px; padding: 22px 24px; margin-bottom: 20px; }
  .card h2 { font-size: 1rem; margin: 0 0 4px; }
  .card .hint { font-size: 0.8rem; color: var(--gray-600); margin: 0 0 18px; }

  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 0.78rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.03em; color: var(--gray-600); margin-bottom: 6px; }
  .field input[type=text], .field input[type=url], .field input[type=email], .field textarea, .field select {
    width: 100%; padding: 10px 12px; border: 1px solid var(--gray-200); border-radius: 6px; font-size: 0.9rem;
    font-family: inherit; background: var(--gray-50);
  }
  .field textarea { min-height: 80px; resize: vertical; }
  .field .desc { font-size: 0.75rem; color: var(--gray-400); margin-top: 4px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
  @media (max-width: 640px) { .row2, .row3 { grid-template-columns: 1fr; } }
  .checkbox-field { display: flex; align-items: center; gap: 8px; }
  .checkbox-field label { margin: 0; text-transform: none; font-weight: 600; font-size: 0.85rem; }

  .item-card { border: 1px solid var(--gray-200); border-radius: 8px; margin-bottom: 12px; background: var(--gray-50); }
  .item-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; cursor: pointer; }
  .item-head-title { font-size: 0.87rem; font-weight: 600; }
  .item-head-sub { font-size: 0.76rem; color: var(--gray-600); margin-top: 2px; }
  .item-controls { display: flex; gap: 6px; align-items: center; }
  .item-body { padding: 4px 16px 18px; border-top: 1px solid var(--gray-200); display: none; }
  .item-body.open { display: block; }
  .icon-btn { background: none; border: 1px solid var(--gray-200); border-radius: 5px; width: 28px; height: 28px;
    display: inline-flex; align-items: center; justify-content: center; font-size: 0.85rem; color: var(--gray-600); }
  .icon-btn:hover { background: var(--gray-100); }

  .add-row { margin-top: 8px; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff;
    padding: 12px 22px; border-radius: 8px; font-size: 0.85rem; opacity: 0; pointer-events: none; transition: 0.25s;
    z-index: 100; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-6px); }

  .filepick { border: 2px dashed var(--gray-200); border-radius: 10px; padding: 40px 20px; text-align: center;
    color: var(--gray-600); margin-bottom: 20px; background: #fff; }
  .filepick strong { color: var(--ink); }
  .filepick input { display: none; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 0.68rem; font-weight: 700;
    text-transform: uppercase; background: var(--gray-200); color: var(--gray-600); margin-left: 8px; }
  .badge.tbd { background: #fdeccb; color: #92620b; }
  .list-toolbar { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
  .list-toolbar select, .list-toolbar input { padding: 8px 10px; border: 1px solid var(--gray-200); border-radius: 6px;
    font-size: 0.82rem; font-family: inherit; }
  .empty-msg { color: var(--gray-400); font-size: 0.85rem; padding: 20px 0; text-align: center; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); display: inline-block; margin-right: 6px; }
  .top-hint { font-size: 0.78rem; color: rgba(255,255,255,0.65); }
</style>
</head>
<body>

<header>
  <h1>Dr. Mo. Lab <span>Content Manager</span></h1>
  <div class="header-actions">
    <button class="btn btn-secondary btn-sm" id="btnLoadFile">Load content.json</button>
    <input type="file" id="fileInput" accept="application/json" style="display:none" />
    <button class="btn btn-secondary" id="btnDownloadJson">Download content.json</button>
    <button class="btn btn-primary" id="btnGenerate">Generate Website</button>
  </div>
</header>

<div class="tabs" id="tabs"></div>

<main id="main"></main>

<div class="toast" id="toast"></div>

<script>
/* ============ EMBEDDED SOURCE DATA (baked in at build time) ============ */
const DEFAULT_CONTENT = /*__DEFAULT_CONTENT__*/ null;
const TEMPLATE_HTML = /*__TEMPLATE_HTML__*/ "";
const SITE_CSS = /*__SITE_CSS__*/ "";
const SITE_JS = /*__SITE_JS__*/ "";

/* ============ TEMPLATE ENGINE (mirrors template-engine.js) ============ */
function escapeHtml(str) {
  if (str === null || str === undefined) return "";
  return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function getPath(stack, path) {
  if (path === "this" || path === ".") return stack[stack.length - 1];
  if (path === "@index") return stack.__index;
  const parts = path.split(".");
  for (let i = stack.length - 1; i >= 0; i--) {
    let cur = stack[i], ok = true;
    for (const p of parts) {
      if (cur === null || cur === undefined || !(p in Object(cur))) { ok = false; break; }
      cur = cur[p];
    }
    if (ok) return cur;
  }
  return undefined;
}
function parseTpl(tpl) {
  const tagRe = /\{\{\{?\s*([^{}]+?)\s*\}?\}\}/g;
  let pos = 0, match;
  const root = { type: "root", children: [] };
  const stack = [root];
  const top = () => stack[stack.length - 1];
  while ((match = tagRe.exec(tpl))) {
    const raw = match[0];
    const isRaw = raw.slice(0, 3) === "{{{";
    const inner = match[1].trim();
    const textBefore = tpl.slice(pos, match.index);
    if (textBefore) top().children.push({ type: "text", value: textBefore });
    pos = match.index + raw.length;
    if (inner.indexOf("#each ") === 0) {
      const node = { type: "each", path: inner.slice(6).trim(), children: [] };
      top().children.push(node); stack.push(node);
    } else if (inner.indexOf("#if ") === 0) {
      const node = { type: "if", path: inner.slice(4).trim(), children: [], elseChildren: null };
      top().children.push(node); stack.push(node);
    } else if (inner === "else") {
      const cur = top(); cur.elseChildren = [];
      stack.push({ type: "__elseFrame", children: cur.elseChildren, __owner: cur });
    } else if (inner === "/each" || inner === "/if") {
      if (top().type === "__elseFrame") stack.pop();
      stack.pop();
    } else {
      top().children.push({ type: isRaw ? "raw" : "var", path: inner });
    }
  }
  const rest = tpl.slice(pos);
  if (rest) top().children.push({ type: "text", value: rest });
  return root;
}
function renderNodes(nodes, ctxStack) {
  let out = "";
  for (const n of nodes) {
    if (n.type === "text") out += n.value;
    else if (n.type === "var") out += escapeHtml(getPath(ctxStack, n.path));
    else if (n.type === "raw") { const v = getPath(ctxStack, n.path); out += (v === undefined || v === null) ? "" : String(v); }
    else if (n.type === "if") {
      const val = getPath(ctxStack, n.path);
      const truthy = val && !(Array.isArray(val) && val.length === 0);
      out += truthy ? renderNodes(n.children, ctxStack) : (n.elseChildren ? renderNodes(n.elseChildren, ctxStack) : "");
    } else if (n.type === "each") {
      const arr = getPath(ctxStack, n.path) || [];
      for (let j = 0; j < arr.length; j++) {
        ctxStack.push(arr[j]); ctxStack.__index = j;
        out += renderNodes(n.children, ctxStack);
        ctxStack.pop();
      }
    }
  }
  return out;
}
function renderTemplate(tpl, data) { return renderNodes(parseTpl(tpl).children, [data]); }

/* ============ APP STATE ============ */
let data = DEFAULT_CONTENT ? JSON.parse(JSON.stringify(DEFAULT_CONTENT)) : null;
let openItems = {}; // tracks which repeater items are expanded, keyed by "section-index"

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

/* ============ TABS ============ */
const TABS = [
  { id: 'site', label: 'Site & Branding' },
  { id: 'hero', label: 'Hero' },
  { id: 'acronym', label: 'Acronym' },
  { id: 'updates', label: 'Updates' },
  { id: 'team', label: 'Team' },
  { id: 'publications', label: 'Publications' },
  { id: 'contact', label: 'Contact' },
  { id: 'footer', label: 'Footer' }
];
let activeTab = 'site';

function renderTabs() {
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = '';
  TABS.forEach(t => {
    const b = document.createElement('button');
    b.className = 'tab-btn' + (t.id === activeTab ? ' active' : '');
    b.textContent = t.label;
    b.onclick = () => { activeTab = t.id; renderTabs(); renderMain(); };
    tabsEl.appendChild(b);
  });
}

/* ============ FIELD HELPERS ============ */
function field(labelText, valuePath, opts = {}) {
  const id = 'f_' + valuePath.replace(/[.\[\]]/g, '_') + '_' + Math.random().toString(36).slice(2, 7);
  const val = getByPath(data, valuePath);
  const wrap = document.createElement('div');
  wrap.className = 'field';
  const lab = document.createElement('label');
  lab.textContent = labelText;
  lab.htmlFor = id;
  wrap.appendChild(lab);
  let input;
  if (opts.textarea) {
    input = document.createElement('textarea');
    input.value = val || '';
  } else if (opts.select) {
    input = document.createElement('select');
    opts.select.forEach(optVal => {
      const o = document.createElement('option');
      o.value = optVal; o.textContent = optVal;
      if (optVal === val) o.selected = true;
      input.appendChild(o);
    });
  } else if (opts.checkbox) {
    wrap.className = 'field checkbox-field';
    input = document.createElement('input');
    input.type = 'checkbox';
    input.checked = !!val;
    wrap.innerHTML = '';
    wrap.appendChild(input);
    wrap.appendChild(lab);
  } else {
    input = document.createElement('input');
    input.type = opts.type || 'text';
    input.value = val || '';
  }
  input.id = id;
  if (opts.placeholder) input.placeholder = opts.placeholder;
  const evt = (opts.checkbox || opts.select) ? 'change' : 'input';
  input.addEventListener(evt, () => {
    const v = opts.checkbox ? input.checked : input.value;
    setByPath(data, valuePath, v);
  });
  wrap.appendChild(input);
  if (opts.desc) {
    const d = document.createElement('p');
    d.className = 'desc';
    d.textContent = opts.desc;
    wrap.appendChild(d);
  }
  return wrap;
}

function getByPath(obj, path) {
  return path.split('.').reduce((o, k) => {
    const m = k.match(/^(.+)\[(\d+)\]$/);
    if (m) return (o || {})[m[1]] ? (o[m[1]] || [])[+m[2]] : undefined;
    return (o || {})[k];
  }, obj);
}
function setByPath(obj, path, value) {
  const parts = path.split('.');
  let cur = obj;
  for (let i = 0; i < parts.length - 1; i++) {
    const m = parts[i].match(/^(.+)\[(\d+)\]$/);
    if (m) cur = cur[m[1]][+m[2]];
    else cur = cur[parts[i]];
  }
  const last = parts[parts.length - 1];
  const m = last.match(/^(.+)\[(\d+)\]$/);
  if (m) cur[m[1]][+m[2]] = value; else cur[last] = value;
}

function sectionCard(title, hint, children) {
  const card = document.createElement('div');
  card.className = 'card';
  const h = document.createElement('h2'); h.textContent = title; card.appendChild(h);
  if (hint) { const p = document.createElement('p'); p.className = 'hint'; p.textContent = hint; card.appendChild(p); }
  children.forEach(c => card.appendChild(c));
  return card;
}

function row(...fields) {
  const wrap = document.createElement('div');
  wrap.className = fields.length === 3 ? 'row3' : 'row2';
  fields.forEach(f => wrap.appendChild(f));
  return wrap;
}

function btn(label, cls, onClick) {
  const b = document.createElement('button');
  b.className = 'btn ' + cls;
  b.textContent = label;
  b.onclick = onClick;
  return b;
}

/* Generic repeater list: arr = reference array, itemLabel(fn)->{title,sub}, renderForm(item)->[fields], onAdd, key */
function repeater(key, arr, itemLabelFn, renderFormFn, newItemFn) {
  const wrap = document.createElement('div');
  if (arr.length === 0) {
    const e = document.createElement('div'); e.className = 'empty-msg'; e.textContent = 'No items yet.'; wrap.appendChild(e);
  }
  arr.forEach((item, idx) => {
    const itemKey = key + '-' + idx;
    const card = document.createElement('div'); card.className = 'item-card';
    const head = document.createElement('div'); head.className = 'item-head';
    const { title, sub } = itemLabelFn(item, idx);
    const titleWrap = document.createElement('div');
    const t = document.createElement('div'); t.className = 'item-head-title'; t.textContent = title || '(untitled)';
    titleWrap.appendChild(t);
    if (sub) { const s = document.createElement('div'); s.className = 'item-head-sub'; s.textContent = sub; titleWrap.appendChild(s); }
    head.appendChild(titleWrap);

    const controls = document.createElement('div'); controls.className = 'item-controls';
    if (idx > 0) controls.appendChild(iconBtn('↑', (e) => { e.stopPropagation(); [arr[idx-1], arr[idx]] = [arr[idx], arr[idx-1]]; renderMain(); }));
    if (idx < arr.length - 1) controls.appendChild(iconBtn('↓', (e) => { e.stopPropagation(); [arr[idx+1], arr[idx]] = [arr[idx], arr[idx+1]]; renderMain(); }));
    controls.appendChild(iconBtn('✕', (e) => { e.stopPropagation(); if (confirm('Delete this item?')) { arr.splice(idx, 1); renderMain(); } }));
    head.appendChild(controls);

    const body = document.createElement('div'); body.className = 'item-body' + (openItems[itemKey] ? ' open' : '');
    renderFormFn(item, idx).forEach(f => body.appendChild(f));

    head.onclick = () => { openItems[itemKey] = !openItems[itemKey]; renderMain(); };
    card.appendChild(head); card.appendChild(body);
    wrap.appendChild(card);
  });
  const addBtn = btn('+ Add', 'btn-light btn-sm add-row', () => {
    arr.push(newItemFn());
    openItems[key + '-' + (arr.length - 1)] = true;
    renderMain();
  });
  wrap.appendChild(addBtn);
  return wrap;
}
function iconBtn(label, onClick) {
  const b = document.createElement('button'); b.className = 'icon-btn'; b.textContent = label; b.onclick = onClick;
  return b;
}

/* ============ PANEL RENDERERS ============ */
function panelSite() {
  return [sectionCard('Site & Branding', 'Basic identity shown in the browser tab and the nav bar.', [
    field('Page Title (browser tab)', 'site.title'),
    row(field('Lab Name', 'site.labName'), field('Logo image path', 'site.logo', { desc: 'Relative path, e.g. images/logo.jpg' })),
    field('Lab Tagline', 'site.labTagline')
  ])];
}

function panelHero() {
  return [sectionCard('Hero Section', 'The big banner at the top of the homepage.', [
    field('Mission Tag', 'hero.missionTag'),
    field('Heading (HTML allowed — use <em>…</em> for italics, <br/> for line breaks)', 'hero.headingHtml', { textarea: true }),
    field('Description', 'hero.description', { textarea: true }),
    field('Background image path', 'hero.bgImage'),
    row(field('Primary button text', 'hero.ctaPrimaryText'), field('Primary button link', 'hero.ctaPrimaryHref')),
    row(field('Secondary button text', 'hero.ctaSecondaryText'), field('Secondary button link', 'hero.ctaSecondaryHref'))
  ])];
}

function panelAcronym() {
  return [sectionCard('Acronym Section', 'The "What Dr. Mo. stands for" block. Note: the D-r-M-o letter reveal itself is fixed in the template design and isn\u2019t editable here.', [
    field('Tag line', 'acronym.tag'),
    field('Body text (HTML allowed — <strong> for bold)', 'acronym.bodyHtml', { textarea: true }),
    field('Photo path', 'acronym.photo')
  ])];
}

function panelUpdates() {
  const u = data.updates;
  return [
    sectionCard('Updates — Section Header', '', [
      field('Section label', 'updates.sectionLabel'),
      field('Section title (HTML allowed)', 'updates.sectionTitleHtml'),
      field('Section subtitle', 'updates.sectionSubtitle')
    ]),
    sectionCard('Featured Updates', 'The larger cards in the main column (usually 1\u20132).', [
      repeater('feat', u.featured, (it) => ({ title: it.title, sub: it.type + (it.date ? ' \u00b7 ' + it.date : '') }),
        (it) => [
          row(field('Type label', `updates.featured[${u.featured.indexOf(it)}].type`), field('Date (optional)', `updates.featured[${u.featured.indexOf(it)}].date`)),
          field('Title', `updates.featured[${u.featured.indexOf(it)}].title`),
          field('Excerpt', `updates.featured[${u.featured.indexOf(it)}].excerpt`, { textarea: true }),
          field('Placeholder label (shown if no image set)', `updates.featured[${u.featured.indexOf(it)}].imageLabel`),
          field('Image path (optional — overrides placeholder)', `updates.featured[${u.featured.indexOf(it)}].image`)
        ],
        () => ({ imageLabel: 'Photo / event banner', image: null, type: 'Lab Update', title: 'New update', excerpt: '', date: null }))
    ]),
    sectionCard('Mini Updates', 'The compact list in the sidebar.', [
      repeater('mini', u.mini, (it) => ({ title: it.title, sub: it.type + (it.date ? ' \u00b7 ' + it.date : '') }),
        (it) => [
          row(field('Type label', `updates.mini[${u.mini.indexOf(it)}].type`), field('Date', `updates.mini[${u.mini.indexOf(it)}].date`)),
          field('Title', `updates.mini[${u.mini.indexOf(it)}].title`)
        ],
        () => ({ type: 'Update', title: 'New update', date: 'Ongoing' }))
    ])
  ];
}

function memberFields(basePath, arr, it) {
  const i = arr.indexOf(it);
  const p = `${basePath}[${i}]`;
  return [
    row(field('Photo path', `${p}.photo`), field('Name', `${p}.name`)),
    row(field('Role', `${p}.role`), field('Department', `${p}.dept`)),
    row(field('Project label', `${p}.projectLabel`, { desc: '"Project" or "Projects"' }), field('TBD (project/dept still undecided)', `${p}.tbd`, { checkbox: true })),
    field('Project description', `${p}.project`, { textarea: true }),
    row(field('LinkedIn URL (optional)', `${p}.linkedinUrl`), field('Website URL (optional)', `${p}.websiteUrl`))
  ];
}

function panelTeam() {
  const pi = data.pi, t = data.team;
  return [
    sectionCard('Principal Investigator', '', [
      row(field('Photo path', 'pi.photo'), field('Name', 'pi.name')),
      row(field('Role label', 'pi.role'), field('Title / affiliation', 'pi.title')),
      field('Bio', 'pi.bio', { textarea: true }),
      field('Google Scholar URL (optional)', 'pi.scholarUrl')
    ]),
    sectionCard('Team Section Header', '', [
      field('Section label', 'team.sectionLabel'),
      field('Section title (HTML allowed)', 'team.sectionTitleHtml'),
      field('Section subtitle', 'team.sectionSubtitle'),
      row(field('"Current members" label', 'team.currentLabel'), field('"Alumni" label', 'team.alumniLabel'))
    ]),
    sectionCard('Current Members', `${t.current.length} member(s)`, [
      repeater('cur', t.current, (m) => ({ title: m.name, sub: m.role + (m.tbd ? ' \u2022 TBD' : '') }),
        (m) => memberFields('team.current', t.current, m),
        () => ({ photo: 'images/placeholder.jpg', name: 'New Member', role: 'Undergraduate Researcher', dept: 'Department TBD', projectLabel: 'Project', project: 'Project TBD', tbd: true, linkedinUrl: '', websiteUrl: '' }))
    ]),
    sectionCard('Alumni', `${t.alumni.length} member(s)`, [
      repeater('alum', t.alumni, (m) => ({ title: m.name, sub: m.role }),
        (m) => memberFields('team.alumni', t.alumni, m),
        () => ({ photo: 'images/placeholder.jpg', name: 'New Alumnus/Alumna', role: 'Undergraduate Researcher', dept: '', projectLabel: 'Project', project: '', tbd: false, linkedinUrl: '', websiteUrl: '' }))
    ])
  ];
}

function panelPublications() {
  const p = data.publications;
  const wrap = document.createElement('div');
  const toolbar = document.createElement('div'); toolbar.className = 'list-toolbar';
  const searchInput = document.createElement('input');
  searchInput.type = 'text'; searchInput.placeholder = 'Filter by title/author\u2026'; searchInput.style.flex = '1';
  const catSelect = document.createElement('select');
  ['all', 'journal', 'conference', 'dissertation', 'magazine'].forEach(c => {
    const o = document.createElement('option'); o.value = c; o.textContent = c === 'all' ? 'All types' : c;
    catSelect.appendChild(o);
  });
  toolbar.appendChild(searchInput); toolbar.appendChild(catSelect);
  wrap.appendChild(toolbar);

  const listMount = document.createElement('div');
  wrap.appendChild(listMount);

  function renderList() {
    listMount.innerHTML = '';
    const q = searchInput.value.toLowerCase();
    const cat = catSelect.value;
    const visible = p.items.filter(it =>
      (cat === 'all' || it.type === cat) &&
      (!q || (it.title + ' ' + it.authors).toLowerCase().includes(q))
    );
    const info = document.createElement('p'); info.className = 'hint';
    info.textContent = `Showing ${visible.length} of ${p.items.length} publications.`;
    listMount.appendChild(info);
    if (visible.length === 0) {
      const e = document.createElement('div'); e.className = 'empty-msg'; e.textContent = 'No matches.'; listMount.appendChild(e);
    }
    visible.forEach((it) => {
      const idx = p.items.indexOf(it);
      const card = document.createElement('div'); card.className = 'item-card';
      const head = document.createElement('div'); head.className = 'item-head';
      const titleWrap = document.createElement('div');
      const t = document.createElement('div'); t.className = 'item-head-title'; t.textContent = it.title;
      const s = document.createElement('div'); s.className = 'item-head-sub'; s.textContent = `${it.authors} \u2014 ${it.venue} (${it.year})`;
      titleWrap.appendChild(t); titleWrap.appendChild(s);
      head.appendChild(titleWrap);
      const controls = document.createElement('div'); controls.className = 'item-controls';
      controls.appendChild(iconBtn('✕', (e) => { e.stopPropagation(); if (confirm('Delete this publication?')) { p.items.splice(idx, 1); renderMain(); } }));
      head.appendChild(controls);
      const key = 'pub-' + idx;
      const body = document.createElement('div'); body.className = 'item-body' + (openItems[key] ? ' open' : '');
      body.appendChild(field('Title', `publications.items[${idx}].title`, { textarea: true }));
      body.appendChild(row(
        field('Type', `publications.items[${idx}].type`, { select: ['journal', 'conference', 'dissertation', 'magazine'] }),
        field('Badge label', `publications.items[${idx}].badge`, { desc: 'e.g. "Journal Article", "Conference"' })
      ));
      body.appendChild(field('Authors', `publications.items[${idx}].authors`));
      body.appendChild(field('Venue', `publications.items[${idx}].venue`));
      body.appendChild(row(
        field('Year', `publications.items[${idx}].year`),
        field('Scholar link (optional)', `publications.items[${idx}].scholarLink`)
      ));
      body.appendChild(field('Award (optional)', `publications.items[${idx}].award`, { placeholder: 'e.g. Best DEI Paper' }));
      head.onclick = () => { openItems[key] = !openItems[key]; renderMain(); };
      card.appendChild(head); card.appendChild(body);
      listMount.appendChild(card);
    });
    const addBtn = btn('+ Add Publication', 'btn-light btn-sm add-row', () => {
      p.items.unshift({ type: 'journal', badge: 'Journal Article', title: 'New publication title', authors: '', venue: '', year: String(new Date().getFullYear()), award: null, scholarLink: null });
      openItems['pub-0'] = true;
      renderMain();
    });
    listMount.appendChild(addBtn);
  }
  searchInput.addEventListener('input', renderList);
  catSelect.addEventListener('change', renderList);
  renderList();

  return [sectionCard('Publications — Section Header', '', [
    field('Section label', 'publications.sectionLabel'),
    field('Section title', 'publications.sectionTitle'),
    field('Section subtitle', 'publications.sectionSubtitle'),
    field('Search box placeholder', 'publications.searchPlaceholder')
  ]), sectionCard('Publication List', `${p.items.length} total \u2014 category counts on the site update automatically.`, [wrap])];
}

function panelContact() {
  const c = data.contact;
  return [
    sectionCard('Contact — Section Header', '', [
      field('Section label', 'contact.sectionLabel'),
      field('Section title (HTML allowed)', 'contact.sectionTitleHtml'),
      field('Intro paragraph', 'contact.intro', { textarea: true }),
      field('Reply-to email (where form submissions should go)', 'contact.recipientEmail', { desc: 'Used by the WordPress version\u2019s contact form handler.' })
    ]),
    sectionCard('Contact Info Items', 'The Email / Office / Department rows.', [
      repeater('cinfo', c.items, (it) => ({ title: it.label, sub: it.value }),
        (it) => { const i = c.items.indexOf(it); const p = `contact.items[${i}]`; return [
          row(field('Icon', p + '.iconType', { select: ['mail', 'pin', 'building'] }), field('Label', p + '.label')),
          row(field('Value (displayed text)', p + '.value'), field('Link (optional, e.g. mailto:\u2026)', p + '.href'))
        ]; },
        () => ({ iconType: 'mail', label: 'New Item', value: '', href: '' }))
    ]),
    sectionCard('Contact Form', '', [
      row(field('Form heading', 'contact.formHeading'), field('Submit button text', 'contact.submitText')),
      field('Form subtext', 'contact.formSubtext'),
      field('Subject dropdown placeholder', 'contact.subjectPlaceholder')
    ]),
    panelSubjectOptions()
  ];
}
function panelSubjectOptions() {
  const c = data.contact;
  const wrap = sectionCard('Subject Dropdown Options', '', []);
  const list = document.createElement('div');
  c.subjectOptions.forEach((opt, idx) => {
    const r = document.createElement('div');
    r.style.display = 'flex'; r.style.gap = '8px'; r.style.marginBottom = '8px';
    const inp = document.createElement('input');
    inp.type = 'text'; inp.value = opt; inp.style.flex = '1';
    inp.style.padding = '8px 10px'; inp.style.border = '1px solid var(--gray-200)'; inp.style.borderRadius = '6px';
    inp.addEventListener('input', () => { c.subjectOptions[idx] = inp.value; });
    const del = iconBtn('✕', () => { c.subjectOptions.splice(idx, 1); renderMain(); });
    r.appendChild(inp); r.appendChild(del);
    list.appendChild(r);
  });
  wrap.appendChild(list);
  wrap.appendChild(btn('+ Add Option', 'btn-light btn-sm add-row', () => { c.subjectOptions.push('New Option'); renderMain(); }));
  return wrap;
}

function panelFooter() {
  const f = data.footer;
  return [
    sectionCard('Footer Brand', '', [
      field('Brand name', 'footer.brandName'),
      field('Brand text (HTML allowed — <br/> for line breaks)', 'footer.brandTextHtml', { textarea: true })
    ]),
    sectionCard('External Links', 'The "Links" column (e.g. Google Scholar, department site).', [
      repeater('extlink', f.externalLinks, (it) => ({ title: it.label, sub: it.href }),
        (it) => { const i = f.externalLinks.indexOf(it); return [row(field('Label', `footer.externalLinks[${i}].label`), field('URL', `footer.externalLinks[${i}].href`))]; },
        () => ({ label: 'New Link', href: 'https://' }))
    ]),
    sectionCard('Copyright Line', '', [
      row(field('Copyright text', 'footer.copyrightText'), field('Highlighted phrase (optional)', 'footer.copyrightHighlight', { desc: 'e.g. "Boomer Sooner" \u2014 shown in a styled span' })),
      field('Tagline', 'footer.tagline')
    ])
  ];
}

/* ============ MAIN RENDER ============ */
function renderMain() {
  const mainEl = document.getElementById('main');
  mainEl.innerHTML = '';
  if (!data) {
    mainEl.appendChild(filePickerBlock());
    return;
  }
  let panels;
  switch (activeTab) {
    case 'site': panels = panelSite(); break;
    case 'hero': panels = panelHero(); break;
    case 'acronym': panels = panelAcronym(); break;
    case 'updates': panels = panelUpdates(); break;
    case 'team': panels = panelTeam(); break;
    case 'publications': panels = panelPublications(); break;
    case 'contact': panels = panelContact(); break;
    case 'footer': panels = panelFooter(); break;
    default: panels = [];
  }
  panels.forEach(p => mainEl.appendChild(p));
}

function filePickerBlock() {
  const wrap = document.createElement('div');
  const pick = document.createElement('div'); pick.className = 'filepick';
  pick.innerHTML = '<strong>No content loaded.</strong><br/>Use "Load content.json" above, or start from the bundled sample content.';
  wrap.appendChild(pick);
  wrap.appendChild(btn('Start from bundled content', 'btn-primary', () => {
    data = JSON.parse(JSON.stringify(DEFAULT_CONTENT));
    renderMain();
    toast('Loaded bundled content.');
  }));
  return wrap;
}

/* ============ FILE LOAD / SAVE ============ */
document.getElementById('btnLoadFile').addEventListener('click', () => document.getElementById('fileInput').click());
document.getElementById('fileInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      data = JSON.parse(reader.result);
      openItems = {};
      renderMain();
      toast('Loaded ' + file.name);
    } catch (err) {
      alert('Could not parse that file as JSON: ' + err.message);
    }
  };
  reader.readAsText(file);
});

function downloadFile(filename, content, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

document.getElementById('btnDownloadJson').addEventListener('click', () => {
  if (!data) { alert('No content loaded yet.'); return; }
  downloadFile('content.json', JSON.stringify(data, null, 2), 'application/json');
  toast('Downloaded content.json');
});

function computeDerived(src) {
  const d = JSON.parse(JSON.stringify(src));
  function enrichMember(m) {
    m.hasLinks = !!(m.linkedinUrl || m.websiteUrl);
    m.hasPhoto = !!m.photo;
    m.initials = String(m.name || '')
      .split(/\s+/)
      .filter(Boolean)
      .slice(0, 2)
      .map(part => part.charAt(0).toUpperCase())
      .join('');
  }
  (d.team.current || []).forEach(enrichMember);
  (d.team.alumni || []).forEach(enrichMember);
  const counts = { all: 0, journal: 0, conference: 0, dissertation: 0, magazine: 0 };
  (d.publications.items || []).forEach(p => {
    const raw = [p.title, p.authors, p.venue, p.year].join(' ').toLowerCase();
    p.searchText = raw.replace(/[^a-z0-9\s]/g, '').replace(/\s+/g, ' ').trim();
    counts.all++;
    if (counts[p.type] !== undefined) counts[p.type]++;
  });
  d.publications.counts = counts;
  (d.contact.items || []).forEach(c => {
    c.iconIsMail = c.iconType === 'mail';
    c.iconIsPin = c.iconType === 'pin';
    c.iconIsBuilding = c.iconType === 'building';
    c.hrefMissing = !c.href;
  });
  return d;
}

document.getElementById('btnGenerate').addEventListener('click', () => {
  if (!data) { alert('No content loaded yet.'); return; }
  const derived = computeDerived(data);
  const html = renderTemplate(TEMPLATE_HTML, Object.assign({}, derived, { CSS_BLOCK: SITE_CSS, JS_BLOCK: SITE_JS }));
  downloadFile('index.html', html, 'text/html');
  toast('Generated index.html \u2014 keep it alongside your images/ folder.');
});

/* ============ INIT ============ */
renderTabs();
renderMain();
</script>
</body>
</html>
