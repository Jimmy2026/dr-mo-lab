media:
  input: images
  output: images
  rename: safe
  categories: [image]

content:
  - name: website
    label: Website Content
    type: file
    path: content.json
    format: json
    fields:
      - name: site
        label: Site Identity
        type: object
        fields:
          - name: title
            label: Browser Title
            type: string
          - name: labName
            label: Lab Name
            type: string
          - name: labTagline
            label: Lab Tagline
            type: string
          - name: logo
            label: Logo
            type: image

      - name: hero
        label: Hero
        type: object
        fields:
          - name: missionTag
            label: Eyebrow Label
            type: string
          - name: headingHtml
            label: Heading HTML
            type: text
          - name: description
            label: Description
            type: text
          - name: bgImage
            label: Background Image
            type: image
          - name: ctaPrimaryText
            label: Primary Button Text
            type: string
          - name: ctaPrimaryHref
            label: Primary Button Link
            type: string
          - name: ctaSecondaryText
            label: Secondary Button Text
            type: string
          - name: ctaSecondaryHref
            label: Secondary Button Link
            type: string

      - name: acronym
        label: About Dr. Mo.
        type: object
        fields:
          - name: tag
            label: Section Label
            type: string
          - name: bodyHtml
            label: Body HTML
            type: text
          - name: photo
            label: Photo
            type: image

      - name: updates
        label: Lab Updates
        type: object
        fields:
          - name: sectionLabel
            label: Section Label
            type: string
          - name: sectionTitleHtml
            label: Section Title HTML
            type: text
          - name: sectionSubtitle
            label: Section Subtitle
            type: text
          - name: featured
            label: Featured Updates
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: imageLabel
                label: Image Alt Text
                type: string
              - name: image
                label: Image
                type: image
              - name: type
                label: Update Type
                type: string
              - name: title
                label: Title
                type: string
              - name: excerpt
                label: Excerpt
                type: text
              - name: date
                label: Date
                type: string
          - name: mini
            label: Short Updates
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: type
                label: Update Type
                type: string
              - name: title
                label: Title
                type: string
              - name: date
                label: Date
                type: string

      - name: pi
        label: Principal Investigator
        type: object
        fields:
          - name: photo
            label: Photo
            type: image
          - name: role
            label: Role
            type: string
          - name: name
            label: Name
            type: string
          - name: title
            label: Academic Title
            type: text
          - name: bio
            label: Biography
            type: text
          - name: scholarUrl
            label: Google Scholar URL
            type: string

      - name: team
        label: Team
        type: object
        fields:
          - name: sectionLabel
            label: Section Label
            type: string
          - name: sectionTitleHtml
            label: Section Title HTML
            type: text
          - name: sectionSubtitle
            label: Section Subtitle
            type: text
          - name: currentLabel
            label: Current Members Label
            type: string
          - name: alumniLabel
            label: Alumni Label
            type: string
          - name: current
            label: Current Members
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{name} — {role}"
            fields:
              - name: photo
                label: Photo
                type: image
              - name: name
                label: Name
                type: string
              - name: role
                label: Role
                type: string
              - name: dept
                label: College / Department
                type: text
              - name: projectLabel
                label: Project Label
                type: string
              - name: project
                label: Project
                type: text
              - name: tbd
                label: Project Is TBD
                type: boolean
              - name: linkedinUrl
                label: LinkedIn URL
                type: string
              - name: websiteUrl
                label: Website URL
                type: string
          - name: alumni
            label: Alumni
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{name} — {role}"
            fields:
              - name: photo
                label: Photo
                type: image
              - name: name
                label: Name
                type: string
              - name: role
                label: Role
                type: string
              - name: dept
                label: College / Department
                type: text
              - name: projectLabel
                label: Project Label
                type: string
              - name: project
                label: Project
                type: text
              - name: tbd
                label: Project Is TBD
                type: boolean
              - name: linkedinUrl
                label: LinkedIn URL
                type: string
              - name: websiteUrl
                label: Website URL
                type: string

      - name: publications
        label: Publications
        type: object
        fields:
          - name: sectionLabel
            label: Section Label
            type: string
          - name: sectionTitle
            label: Section Title
            type: string
          - name: sectionSubtitle
            label: Section Subtitle
            type: text
          - name: searchPlaceholder
            label: Search Placeholder
            type: string
          - name: items
            label: Publication List
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{year} — {title}"
            fields:
              - name: type
                label: Internal Type
                type: select
                options:
                  values:
                    - name: conference
                      label: Conference
                    - name: dissertation
                      label: Dissertation
                    - name: journal
                      label: Journal
                    - name: magazine
                      label: Magazine
              - name: badge
                label: Display Badge
                type: string
              - name: title
                label: Title
                type: text
              - name: authors
                label: Authors
                type: text
              - name: venue
                label: Venue
                type: text
              - name: year
                label: Year
                type: string
              - name: award
                label: Award
                type: string
              - name: scholarLink
                label: Publication / Scholar URL
                type: string

      - name: contact
        label: Contact
        type: object
        fields:
          - name: sectionLabel
            label: Section Label
            type: string
          - name: sectionTitleHtml
            label: Section Title HTML
            type: text
          - name: intro
            label: Intro
            type: text
          - name: items
            label: Contact Details
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{label}: {value}"
            fields:
              - name: iconType
                label: Icon
                type: select
                options:
                  values:
                    - name: mail
                      label: Email
                    - name: pin
                      label: Location Pin
                    - name: building
                      label: Building
              - name: label
                label: Label
                type: string
              - name: value
                label: Value
                type: text
              - name: href
                label: Link
                type: string
          - name: formHeading
            label: Form Heading
            type: string
          - name: formSubtext
            label: Form Subtext
            type: string
          - name: subjectPlaceholder
            label: Subject Placeholder
            type: string
          - name: subjectOptions
            label: Subject Options
            type: string
            list: true
          - name: submitText
            label: Submit Button Text
            type: string
          - name: recipientEmail
            label: Recipient Email
            type: string

      - name: footer
        label: Footer
        type: object
        fields:
          - name: brandName
            label: Brand Name
            type: string
          - name: brandTextHtml
            label: Brand Text HTML
            type: text
          - name: externalLinks
            label: External Links
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{label}"
            fields:
              - name: label
                label: Label
                type: string
              - name: href
                label: URL
                type: string
          - name: copyrightText
            label: Copyright Text
            type: string
          - name: copyrightHighlight
            label: Highlighted Copyright Text
            type: string
          - name: tagline
            label: Tagline
            type: string
